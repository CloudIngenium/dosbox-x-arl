name: ARL trace Windows x64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motor:
    name: DEBUG desktop gate Motor
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Test ARL operator desktop script
        shell: pwsh
        timeout-minutes: 30
        run: |
          pwsh -NoProfile -File contrib\arl\tests\Invoke-ArlOperatorDesktopCiGate.ps1 -Depth Motor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  mutantes:
    name: DEBUG desktop gate Mutantes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Mutation-test ARL operator desktop script
        shell: pwsh
        timeout-minutes: 90
        run: |
          pwsh -NoProfile -File contrib\arl\tests\Invoke-ArlOperatorDesktopCiGate.ps1 -Depth Mutantes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
  diag:
    name: DEBUG desktop selftest instrumented ${{ matrix.engine }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        engine: [powershell, pwsh]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Self-test with child output
        shell: pwsh
        timeout-minutes: 30
        env:
          ARL_DEBUG_CHILD: '1'
        run: |
          pwsh -NoProfile -File contrib\arl\tests\diag-instrument.ps1
          & ${{ matrix.engine }} -NoProfile -ExecutionPolicy Bypass -File contrib\arl\Set-ArlOperatorDesktop.ps1 -SelfTest
          Write-Host "exit=$LASTEXITCODE"
