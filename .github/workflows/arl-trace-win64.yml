name: ARL trace Windows x64

on:
  push:
    branches:
      - arl-trace
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_TAG: dosbox-x-v2026.07.02

jobs:
  build-win64-sdl2:
    name: Build ARL trace Win64 SDL2 with Visual Studio
    runs-on: windows-latest

    steps:
      - name: Check out source
        # actions/checkout v7
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up MSBuild
        # microsoft/setup-msbuild v3
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57

      - name: Verify upstream base
        shell: bash
        run: |
          git rev-parse "$UPSTREAM_TAG"
          git log --oneline --decorate -5

      - name: Prepare build info
        shell: bash
        run: |
          shortsha="$(git rev-parse --short=7 HEAD)"
          copyrightyear="$(git show -s --format=%at | xargs -I# date -d @# +'%Y')"
          updatestr="$(git show -s --format=%at | xargs -I# date -d @# +'%b %d, %Y %I:%M:%S%P')"
          echo '/* auto generated */' > include/build_timestamp.h
          echo "#define UPDATED_STR \"${updatestr}\"" >> include/build_timestamp.h
          echo "#define GIT_COMMIT_HASH \"${shortsha}\"" >> include/build_timestamp.h
          echo "#define COPYRIGHT_END_YEAR \"${copyrightyear}\"" >> include/build_timestamp.h
          cat include/build_timestamp.h

      - name: Build DOSBox-X ARL SDL2
        shell: pwsh
        run: |
          msbuild -m vs/dosbox-x.sln -t:dosbox-x:Rebuild -p:Configuration="Release SDL2" -p:Platform=x64
          $exe = 'bin\x64\Release SDL2\dosbox-x.exe'
          if (-not (Test-Path -Path $exe -PathType Leaf)) { exit 1 }
          contrib\windows\installer\PatchPE.exe $exe

      - name: Smoke test DOSBox-X binary
        shell: pwsh
        run: |
          $exe = Resolve-Path 'bin\x64\Release SDL2\dosbox-x.exe'
          & $exe -tests -set waitonerror=false -set logfile=tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content tests.log

      - name: Validate ARL toolkit scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Analyze-ArlTrace.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Start-ArlTraceRun.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Start-ArlEmulator.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Analyze-LatestArlTrace.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Launch-ArlImpactStabilityTrace.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Preserve-ArlTraceRun.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Print-ArlLptCapture.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Watch-ArlLptCapture.ps1)) | Out-Null
          [scriptblock]::Create((Get-Content -Raw contrib\arl\Compare-ArlResultTransactions.ps1)) | Out-Null
          pwsh -NoProfile -File contrib\arl\Analyze-ArlTrace.ps1 `
            -TracePath contrib\arl\fixtures\sample-trace.ndjson `
            -OutDir arl-toolkit-test
          Get-Content arl-toolkit-test\summary.md
          if (-not (Test-Path arl-toolkit-test\protocol-candidates.json)) { throw 'protocol-candidates.json missing' }
          pwsh -NoProfile -File contrib\arl\Analyze-ArlTrace.ps1 `
            -TracePath contrib\arl\fixtures\sample-protocol-trace.ndjson `
            -OutDir arl-toolkit-protocol-test
          Get-Content arl-toolkit-protocol-test\protocol-candidates.md
          pwsh -NoProfile -File contrib\arl\Analyze-ArlTrace.ps1 `
            -TracePath contrib\arl\fixtures\post-result-poll-loop.ndjson `
            -OutDir arl-toolkit-post-loop-test
          Get-Content arl-toolkit-post-loop-test\summary.md
          if ((Get-Content arl-toolkit-post-loop-test\summary.md -Raw) -notmatch 'post_result_poll_loop') {
            throw 'post_result_poll_loop classification missing'
          }
          pwsh -NoProfile -File contrib\arl\Compare-ArlResultTransactions.ps1 `
            -TracePath contrib\arl\fixtures\post-result-poll-loop.ndjson `
            -OutDir arl-toolkit-post-loop-test
          if ((Get-Content arl-toolkit-post-loop-test\result-transaction-comparison.md -Raw) -notmatch 'post-result poll loop') {
            throw 'result comparison did not report post-result poll loop'
          }
          New-Item -ItemType Directory -Force arl-lpt-watch-test | Out-Null
          Set-Content -Path arl-lpt-watch-test\LPTCAP.PRN -Value "ARL PRINT TEST`r`n" -NoNewline -Encoding ASCII
          pwsh -NoProfile -File contrib\arl\Watch-ArlLptCapture.ps1 `
            -CapturePath "$PWD\arl-lpt-watch-test\LPTCAP.PRN" `
            -SpoolDir "$PWD\arl-lpt-watch-test\print-jobs" `
            -ParentPid 999999 `
            -IdleMs 100 `
            -PollMs 50 `
            -AppendFormFeed
          if (-not (Get-ChildItem arl-lpt-watch-test\print-jobs -Filter *.prn)) {
            throw 'LPT watcher did not spool a print job'
          }
          $manifest = Get-ChildItem arl-lpt-watch-test\print-jobs -Filter *.json | Select-Object -First 1 | Get-Content -Raw | ConvertFrom-Json
          if (-not $manifest.append_form_feed) {
            throw 'LPT watcher manifest did not record append_form_feed'
          }
          pwsh -NoProfile -File contrib\arl\Start-ArlEmulator.ps1 `
            -ProfilePath contrib\arl\profiles\arl3460-baseline.json `
            -SelfTest
          pwsh -NoProfile -File contrib\arl\Start-ArlTraceRun.ps1 `
            -Session impact `
            -RunRoot "$PWD\arl-toolkit-run" `
            -DosboxExe "$PWD\missing-dosbox.exe" `
            -NoLaunch
          pwsh -NoProfile -File contrib\arl\Start-ArlTraceRun.ps1 `
            -Session impact-emulator `
            -RunRoot "$PWD\arl-toolkit-emu-run" `
            -DosboxExe "$PWD\missing-dosbox.exe" `
            -NoLaunch
          pwsh -NoProfile -File contrib\arl\Start-ArlTraceRun.ps1 `
            -Session tics-emulator `
            -RunRoot "$PWD\arl-toolkit-emu-run" `
            -DosboxExe "$PWD\missing-dosbox.exe" `
            -NoLaunch

      - name: Package ARL artifact
        shell: bash
        run: |
          timestamp="$(date -u +%Y%m%d%H%M%S)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          package_root="$PWD/package"
          arl_root="$package_root/DOSBox-X-ARL"
          exe_path="$PWD/bin/x64/Release SDL2/dosbox-x.exe"

          rm -rf "$package_root"
          mkdir -p "$arl_root/contrib/arl" "$package_root/arl-patches"

          cp "$exe_path" "$arl_root/dosbox-x-arl.exe"
          cp COPYING "$arl_root/COPYING"
          cp README.md "$arl_root/README.md"
          cp dosbox-x.reference.conf "$arl_root/dosbox-x.reference.conf"
          cp dosbox-x.reference.full.conf "$arl_root/dosbox-x.reference.full.conf"
          cp docs/ARL-TRACE.md "$arl_root/ARL-TRACE.md"
          cp -R contrib/arl/. "$arl_root/contrib/arl/"
          cp contrib/arl/dosbox-arl-trace.conf "$arl_root/dosbox-arl-trace.conf"
          cp contrib/arl/Launch-ArlImpactStabilityTrace.ps1 "$arl_root/Launch-ArlImpactStabilityTrace.ps1"
          cp contrib/arl/Preserve-ArlTraceRun.ps1 "$arl_root/Preserve-ArlTraceRun.ps1"
          cp contrib/arl/Print-ArlLptCapture.ps1 "$arl_root/Print-ArlLptCapture.ps1"
          cp contrib/arl/Watch-ArlLptCapture.ps1 "$arl_root/Watch-ArlLptCapture.ps1"
          cp contrib/arl/Compare-ArlResultTransactions.ps1 "$arl_root/Compare-ArlResultTransactions.ps1"

          ./scripts/arl-export-patch-stack.sh "$UPSTREAM_TAG" "$package_root/arl-patches"

          find "$arl_root" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "$package_root/SHA256SUMS.txt"

          {
            echo "upstream_tag=$UPSTREAM_TAG"
            echo "upstream_base_commit=$(git rev-parse "$UPSTREAM_TAG")"
            echo "head_commit=$(git rev-parse HEAD)"
            echo "build_utc=$timestamp"
            echo "artifact_layout=DOSBox-X-ARL/dosbox-x-arl.exe"
            echo
            echo "arl_patch_commits:"
            git log --reverse --format='  %H %s' "$UPSTREAM_TAG..HEAD"
          } > "$package_root/BUILD-MANIFEST.txt"

          echo "ARL_ARTIFACT_NAME=dosbox-x-arl-${UPSTREAM_TAG#dosbox-x-v}-${short_sha}" >> "$GITHUB_ENV"

      - name: Upload ARL artifact
        # actions/upload-artifact v7.0.1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ env.ARL_ARTIFACT_NAME }}
          path: package
