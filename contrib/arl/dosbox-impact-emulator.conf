# DOSBox-X ARL emulator config for IMPACT / IMPLUS.
# Start Start-ArlEmulator.ps1 before launching this config.
# This config never opens COM5 or any real serial port.

[sdl]
fullscreen = false
autolock = false

[dosbox]
machine = svga_s3
captures = C:\ARL\diagnostics
memsize = 16
logfile = C:\ARL\diagnostics\impact-emulator-dosbox.log

[cpu]
core = normal
cputype = 486
cycles = fixed 12000

[serial]
serial1 = nullmodem server:127.0.0.1 port:3460 transparent:1 rxdelay:1000
serial2 = disabled
serial3 = disabled
serial4 = disabled

[parallel]
parallel1 = file append:C:\ARL\diagnostics\IMPACT-EMU-LPTCAP.PRN timeout:2000
parallel2 = disabled

[dos]
xms = true
ems = true
umb = true

[autoexec]
mount c "C:\ARL\IMPLUS"
c:
DOS\MOUSE.COM
implus
