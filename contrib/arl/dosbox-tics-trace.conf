# DOSBox-X ARL trace config for non-destructive TICS checks.

[sdl]
fullscreen = false
autolock = false

[dosbox]
machine = svga_s3
captures = C:\ARL\diagnostics
memsize = 16
logfile = C:\ARL\diagnostics\tics-dosbox.log

[cpu]
core = normal
cputype = 486
cycles = fixed 12000

[serial]
serial1 = directserial realport:COM5 rxdelay:1000 arltracelevel:basic arltracesession:tics arltracehangms:15000 arltrace:C:\ARL\diagnostics\tics-serial.ndjson
serial2 = disabled
serial3 = disabled
serial4 = disabled

[parallel]
parallel1 = file append:C:\ARL\diagnostics\TICS-LPTCAP.PRN timeout:2000
parallel2 = disabled

[dos]
xms = true
ems = true
umb = true

[autoexec]
mount c "C:\ARL\IMPLUS"
c:
DOS\MOUSE.COM
if exist TICS\TICS.EXE TICS\TICS
if not exist TICS\TICS.EXE TICS
