# DOSBox-X ARL trace config for Laboratorio-ARL.
# Install side-by-side as:
#   C:\ARL\DOSBox-X-ARL\dosbox-x-arl.exe -conf C:\ARL\dosbox-arl-trace.conf
#
# Keep Windows Device Manager FIFO disabled/minimized on the WCH COM5 port.
# This config appends serial evidence to C:\ARL\diagnostics\serial-trace.ndjson.

[sdl]
fullscreen = false
autolock = false

[dosbox]
machine = svga_s3
captures = capture
memsize = 16

[cpu]
core = normal
cputype = 486
cycles = fixed 12000

[serial]
serial1 = directserial realport:COM5 rxdelay:1000 arltrace:C:\ARL\diagnostics\serial-trace.ndjson
serial2 = disabled
serial3 = disabled
serial4 = disabled

[parallel]
parallel1 = file append:LPTCAP.PRN timeout:2000
parallel2 = disabled

[dos]
xms = true
ems = true
umb = true

[autoexec]
mount c "C:\ARL\IMPLUS"
c:
DOS\MOUSE.COM
implus
