# DOSBox-X ARL trace config for shell/status-only trace sessions.

[sdl]
fullscreen = false
autolock = false

[dosbox]
machine = svga_s3
captures = C:\ARL\diagnostics
memsize = 16
logfile = C:\ARL\diagnostics\status-dosbox.log

[cpu]
core = normal
cputype = 486
cycles = fixed 12000

[serial]
serial1 = directserial realport:COM5 rxdelay:1000 arltracelevel:basic arltracesession:status-only arltracehangms:15000 arltrace:C:\ARL\diagnostics\status-serial.ndjson
serial2 = disabled
serial3 = disabled
serial4 = disabled

[parallel]
parallel1 = file append:C:\ARL\diagnostics\STATUS-LPTCAP.PRN timeout:2000
parallel2 = disabled

[dos]
xms = true
ems = true
umb = true

[autoexec]
mount c "C:\ARL\IMPLUS"
c:
DOS\MOUSE.COM
ARLTRACE STATUS
